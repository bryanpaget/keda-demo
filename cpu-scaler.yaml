# KEDA CPU Scaler Demo (Traditional Resource-Based Scaling)
#
# Purpose: contrast CPU-based scaling for a threat analyzer with the Redis
# event-driven threat analyzer. This uses the same workload concept, but scales
# after CPU rises instead of directly from backlog length.
#
# IMPORTANT (lesson learned, thanks Deepesh):
# This cluster enforces clusterwide Cilium policies that put every non-kube-system
# pod into default-deny for ingress AND egress. Without explicit CiliumNetworkPolicy
# rules, the load generator cannot reach the analyzer, so CPU stays at 0 and KEDA has
# nothing to scale on. The policies at the bottom of this file fix that.
#
# Also note: PollingInterval / CooldownPeriod warnings are expected here because
# minReplicaCount > 0 (no scale-to-zero in this demo, which is the point).
#
# Deploy: kubectl apply -f cpu-scaler.yaml
# Watch:  watch -n 2 'kubectl get hpa -n default; kubectl get pods -n default'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-analyzer-cpu
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: threat-analyzer-cpu
  template:
    metadata:
      labels:
        app: threat-analyzer-cpu
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: threat-analyzer-cpu
        image: docker.io/library/nginx:alpine
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /var/cache/nginx
          name: nginx-cache
        - mountPath: /var/run
          name: nginx-run
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: threat-analyzer-cpu-service
  namespace: default
spec:
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: threat-analyzer-cpu

---
# Self-contained threat-load generator, using the same wave-shaped pattern as the Redis
# demo so the audience can see a comparable rise and pause in both trigger types.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: generator
        image: docker.io/library/busybox:1.36
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        command: ["/bin/sh", "-c"]
        args:
        - |
          URL="http://threat-analyzer-cpu-service.default.svc.cluster.local/"
          echo "HTTP LOAD GENERATOR: Starting wave-shaped load..."

          # Ramp concurrent HTTP workers in a 10-step wave, then pause briefly.
          # Each worker keeps making requests throughout the two-second window so
          # nginx has sustained CPU pressure instead of a few isolated bursts.
          t=0
          while true; do
              case $((t % 10)) in
                  0) workers=50 ;; 1) workers=100 ;; 2) workers=150 ;; 3) workers=200 ;; 4) workers=250 ;;
                  5) workers=200 ;; 6) workers=150 ;; 7) workers=100 ;; 8) workers=50 ;; 9) workers=10 ;;
              esac

              echo "[LOAD] Running $workers concurrent HTTP workers at $(date -u +%H:%M:%S)..."
              i=1
              while [ $i -le $workers ]; do
                  (
                      j=1
                      while [ $j -le 20 ]; do
                          wget -q -T 2 -O /dev/null "$URL" || true
                          j=$((j + 1))
                      done
                  ) &
                  i=$((i + 1))
              done
              sleep 2
              wait || true

              t=$((t + 1))
              sleep 2

              # Pause after ten waves so CPU can settle and KEDA has time to scale
              # back down toward the floor of one pod.
              if [ $((t % 10)) -eq 0 ]; then
                  echo "[LOAD] Pause - letting CPU settle before the next wave..."
                  sleep 10
              fi
          done

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: threat-analyzer-cpu-scaler
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: threat-analyzer-cpu
  minReplicaCount: 1
  maxReplicaCount: 5
  cooldownPeriod: 30
  # Note: pollingInterval/cooldown are less relevant with minReplicaCount > 0
  pollingInterval: 15
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "5"

---
# Cilium policies: required because this cluster default-denies pod traffic.
# Allow ingress to the CPU threat analyzer only from the load generator on port 80.
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-loadgen-to-threat-analyzer-cpu
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: threat-analyzer-cpu
  ingress:
  - fromEndpoints:
    - matchLabels:
        app: load-generator
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP

---
# Allow the load generator egress to the CPU threat analyzer on port 80.
# (DNS is already allowed clusterwide; without this, egress is default-deny.)
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: allow-loadgen-egress-to-threat-analyzer-cpu
  namespace: default
spec:
  endpointSelector:
    matchLabels:
      app: load-generator
  egress:
  - toEndpoints:
    - matchLabels:
        app: threat-analyzer-cpu
    toPorts:
    - ports:
      - port: "80"
        protocol: TCP
