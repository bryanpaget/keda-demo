# KEDA Cron Scaler Demo
# This demo shows how KEDA can scale workloads based on time-based schedules
# rather than CPU/Memory resource utilization. Perfect for showing event-driven
# scaling with predictable time-based triggers.
#
# Deploy in any namespace: kubectl apply -f cron-scaler.yaml -n <your-namespace>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-analyzer
  namespace: keda-system
spec:
  replicas: 0
  selector:
    matchLabels:
      app: threat-analyzer
  template:
    metadata:
      labels:
        app: threat-analyzer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: docker.io/library/python:3.9-slim
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command: ["/bin/sh", "-c"]
        args:
        - |
          pip install --no-cache-dir redis > /dev/null 2>&1
          python -c '
          import redis, time
          r = redis.Redis(host="redis-service.keda-system.svc.cluster.local", port=6379, db=0)
          print("DEFENDER POD ACTIVE: Processing security events...")
          while True:
              item = r.lpop("security-alerts")
              if item:
                  print(f"-> NEUTRALIZED: {item.decode(\"utf-8\")}")
                  time.sleep(0.05)
              else:
                  time.sleep(0.5)
          '

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: threat-analyzer-scaler
  namespace: keda-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: threat-analyzer
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 10
  pollingInterval: 2
  triggers:
  - type: cron
    metadata:
      timezone: Etc/UTC
      start: "*/1 * * * *"
      end: "*/2 * * * *"
      desiredReplicas: "3"
