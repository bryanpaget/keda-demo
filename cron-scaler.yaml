# KEDA Cron Scaler Demo (Time-Based Scaling)
#
# Purpose: show a trigger that is not a resource metric at all. The workload sits at
# zero replicas and KEDA scales it up during an active time window defined by a cron
# expression. No CPU, memory, queue, or external system involved.
#
# This file is fully self-contained: a dependency-free worker plus the ScaledObject.
# The schedule below is intentionally aggressive (*/1 to */2 each hour) so the
# scale-up is visible during a demo. Use a realistic window for production.
#
# Deploy: kubectl apply -f cron-scaler.yaml
# Watch:  watch -n 2 'kubectl get pods -n keda-system | grep cron-worker'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron-worker
  namespace: keda-system
spec:
  replicas: 0
  selector:
    matchLabels:
      app: cron-worker
  template:
    metadata:
      labels:
        app: cron-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: docker.io/library/busybox:1.36
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "CRON-SCALED WORKER ACTIVE: $(hostname)"
          while true; do
            echo "[$(date -u +%H:%M:%S)] worker $(hostname) handling scheduled workload"
            sleep 10
          done

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cron-worker-scaler
  namespace: keda-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cron-worker
  minReplicaCount: 0
  maxReplicaCount: 10
  cooldownPeriod: 10
  pollingInterval: 2
  triggers:
  - type: cron
    metadata:
      timezone: Etc/UTC
      start: "*/1 * * * *"
      end: "*/2 * * * *"
      desiredReplicas: "3"
